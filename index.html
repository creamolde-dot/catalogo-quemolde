<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - Qué Molde</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        petroleo: '#006874',
                        petroleolight: '#008b9b',
                        petroleodark: '#004a53',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Roboto:wght@400;500&display=swap');
        body { font-family: 'Roboto', sans-serif; }
        h1, h2, h3, .font-montserrat { font-family: 'Montserrat', sans-serif; }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Navegación -->
    <nav class="bg-petroleo text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-cube text-2xl"></i>
                    <span class="font-montserrat font-bold text-xl tracking-wider">QUÉ MOLDE</span>
                </div>
                <div class="flex items-center space-x-4">
                    <select id="modeSelector" onchange="handleModeChange()" class="bg-petroleodark text-white rounded px-3 py-1 text-sm border border-petroleolight focus:outline-none">
                        <option value="visitante">👤 Visitante</option>
                        <option value="mayorista">🏢 Mayorista</option>
                        <option value="admin">⚙️ Administrador</option>
                    </select>
                </div>
            </div>
        </div>
    </nav>

    <!-- Modal de Seguridad Admin -->
    <div id="authModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-xl max-w-sm w-full">
            <h2 class="text-xl font-bold text-petroleo mb-4 font-montserrat">Acceso Restringido</h2>
            <p class="text-sm text-gray-600 mb-4">Ingrese el código de acceso para modo administrador o mayorista.</p>
            <input type="password" id="authCode" class="w-full border rounded px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-petroleo" placeholder="Código de acceso">
            <p id="authError" class="text-red-500 text-xs mb-4 hidden">Código incorrecto.</p>
            <div class="flex justify-end gap-2">
                <button onclick="cancelAuth()" class="px-4 py-2 text-gray-500 hover:text-gray-700">Cancelar</button>
                <button onclick="verifyAuth()" class="px-4 py-2 bg-petroleo text-white rounded hover:bg-petroleolight">Ingresar</button>
            </div>
        </div>
    </div>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Vista de Catálogo (Visitante / Mayorista) -->
        <div id="catalogView">
            
            <!-- Filtros de Categorías -->
            <div class="flex flex-wrap gap-2 mb-8 justify-center" id="categoryFilters">
                <button onclick="filterCategory('Todas')" class="cat-btn active px-4 py-2 rounded-full bg-petroleo text-white text-sm font-semibold transition">Todas</button>
                <button onclick="filterCategory('Navidad')" class="cat-btn px-4 py-2 rounded-full bg-gray-200 text-gray-700 hover:bg-gray-300 text-sm font-semibold transition">Navidad</button>
                <button onclick="filterCategory('Figuras de colección')" class="cat-btn px-4 py-2 rounded-full bg-gray-200 text-gray-700 hover:bg-gray-300 text-sm font-semibold transition">Figuras de colección</button>
                <button onclick="filterCategory('Llaveros')" class="cat-btn px-4 py-2 rounded-full bg-gray-200 text-gray-700 hover:bg-gray-300 text-sm font-semibold transition">Llaveros</button>
                <button onclick="filterCategory('Mascotas')" class="cat-btn px-4 py-2 rounded-full bg-gray-200 text-gray-700 hover:bg-gray-300 text-sm font-semibold transition">Mascotas</button>
                <button onclick="filterCategory('Gadgets y accesorios')" class="cat-btn px-4 py-2 rounded-full bg-gray-200 text-gray-700 hover:bg-gray-300 text-sm font-semibold transition">Gadgets y accesorios</button>
            </div>

            <!-- Grid de Productos -->
            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Productos inyectados por JS -->
            </div>
        </div>

        <!-- Vista de Administrador -->
        <div id="adminView" class="hidden">
            <h2 class="text-2xl font-bold text-petroleo mb-6 font-montserrat">Gestión de Inventario y Costos</h2>
            
            <!-- Formulario Agregar Producto -->
            <div class="bg-white p-6 rounded-lg shadow-md mb-8 border-t-4 border-petroleo">
                <h3 class="text-lg font-bold text-gray-800 mb-4">Agregar Nuevo Producto</h3>
                <form id="addProductForm" onsubmit="addProduct(event)" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Fila 1 -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase">Nombre del producto</label>
                        <input type="text" id="pName" required class="mt-1 w-full border rounded px-3 py-2 text-sm focus:ring-petroleo focus:border-petroleo">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase">Categoría</label>
                        <select id="pCategory" required class="mt-1 w-full border rounded px-3 py-2 text-sm focus:ring-petroleo">
                            <option value="Navidad">Navidad</option>
                            <option value="Figuras de colección">Figuras de colección</option>
                            <option value="Llaveros">Llaveros</option>
                            <option value="Mascotas">Mascotas</option>
                            <option value="Gadgets y accesorios">Gadgets y accesorios</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase">Cargar Imagen</label>
                        <input type="file" id="pImageFile" accept="image/*" required class="mt-1 w-full border rounded text-sm focus:ring-petroleo file:mr-4 file:py-2 file:px-4 file:rounded-l file:border-0 file:text-sm file:font-semibold file:bg-gray-100 file:text-petroleo hover:file:bg-gray-200">
                    </div>

                    <!-- Fila 2 (Descripción ocupa 3 columnas) -->
                    <div class="lg:col-span-3">
                        <label class="block text-xs font-semibold text-gray-600 uppercase">Descripción del producto</label>
                        <textarea id="pDescription" required rows="2" class="mt-1 w-full border rounded px-3 py-2 text-sm focus:ring-petroleo" placeholder="Ej. Centro de mesa impreso en PLA, diseño exclusivo de Creamolde..."></textarea>
                    </div>

                    <!-- Fila 3 -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase">Gramos de Filamento</label>
                        <input type="number" id="pGrams" step="0.1" required class="mt-1 w-full border rounded px-3 py-2 text-sm focus:ring-petroleo">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase">Horas de Impresión</label>
                        <input type="number" id="pHours" step="0.1" required class="mt-1 w-full border rounded px-3 py-2 text-sm focus:ring-petroleo">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase">Margen Ganancia (%)</label>
                        <input type="number" id="pMargin" value="50" required class="mt-1 w-full border rounded px-3 py-2 text-sm focus:ring-petroleo">
                    </div>

                    <!-- Fila 4 Botón -->
                    <div class="lg:col-span-3 mt-2">
                        <button type="submit" class="w-full bg-petroleo hover:bg-petroleolight text-white font-bold py-3 px-4 rounded transition">
                            <i class="fa-solid fa-plus mr-2"></i> Guardar Producto y Calcular Costos
                        </button>
                    </div>
                </form>
            </div>

            <!-- Tabla de Inventario -->
            <div class="bg-white rounded-lg shadow-md overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Producto</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase">Categoría</th>
                            <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">Costo Producción</th>
                            <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">Precio Base</th>
                            <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase">Precio Mayorista</th>
                            <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- Filas inyectadas por JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        // Variables Base
        const COSTO_GRAMO = 80;
        const COSTO_HORA = 200;
        const COSTO_EDICION = 5000;
        const DESGASTE_MAQUINA = 8000;
        const WHATSAPP_LINK = "https://wa.me/message/R6TY7WD2YKEWG1";
        
        let currentMode = 'visitante';
        let pendingMode = '';
        let currentCategory = 'Todas';

        // Cargar productos de LocalStorage
        let products = JSON.parse(localStorage.getItem('quemolde_products')) || [
            { 
                id: 1, 
                name: 'Centro de mesa Navideño', 
                description: 'Desde los personajes más divertidos hasta los detalles más tradicionales… tenemos diseños para llenar cada rincón de magia.',
                category: 'Navidad', 
                image: 'https://images.unsplash.com/photo-1543589077-47d81606c1bf?auto=format&fit=crop&w=500', 
                grams: 250, 
                hours: 8, 
                margin: 50, 
                cost: 43000, 
                price: 64500 
            }
        ];

        // Formateador de moneda COP
        const formatterCOP = new Intl.NumberFormat('es-CO', {
            style: 'currency',
            currency: 'COP',
            minimumFractionDigits: 0
        });

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            renderCatalog();
            renderAdminTable();
        });

        // Cambio de Modo
        function handleModeChange() {
            const selector = document.getElementById('modeSelector');
            pendingMode = selector.value;
            
            if (pendingMode === 'admin' || pendingMode === 'mayorista') {
                document.getElementById('authModal').classList.remove('hidden');
                document.getElementById('authCode').value = '';
                document.getElementById('authError').classList.add('hidden');
            } else {
                setMode('visitante');
            }
        }

        function cancelAuth() {
            document.getElementById('authModal').classList.add('hidden');
            document.getElementById('modeSelector').value = currentMode;
        }

        function verifyAuth() {
            const code = document.getElementById('authCode').value;
            if ((pendingMode === 'admin' && (code === 'Creamolde' || code === '2026')) || 
                (pendingMode === 'mayorista' && (code === 'Mayorista' || code === 'Creamolde' || code === '2026'))) {
                document.getElementById('authModal').classList.add('hidden');
                setMode(pendingMode);
            } else {
                document.getElementById('authError').classList.remove('hidden');
            }
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('modeSelector').value = mode;
            
            if (mode === 'admin') {
                document.getElementById('catalogView').classList.add('hidden');
                document.getElementById('adminView').classList.remove('hidden');
            } else {
                document.getElementById('adminView').classList.add('hidden');
                document.getElementById('catalogView').classList.remove('hidden');
                renderCatalog();
            }
        }

        // Filtros de Categoría
        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if(btn.innerText === cat) {
                    btn.classList.remove('bg-gray-200', 'text-gray-700');
                    btn.classList.add('bg-petroleo', 'text-white');
                } else {
                    btn.classList.add('bg-gray-200', 'text-gray-700');
                    btn.classList.remove('bg-petroleo', 'text-white');
                }
            });
            renderCatalog();
        }

        // Renderizado del Catálogo
        function renderCatalog() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            const filtered = currentCategory === 'Todas' 
                ? products 
                : products.filter(p => p.category === currentCategory);

            filtered.forEach(p => {
                const wholesalePrice = p.price * 0.85; // 15% descuento corporativo
                
                let priceHTML = '';
                if (currentMode === 'mayorista') {
                    priceHTML = `
                        <p class="text-sm text-gray-400 line-through">${formatterCOP.format(p.price)}</p>
                        <p class="text-xl font-bold text-green-600">${formatterCOP.format(wholesalePrice)} <span class="text-xs text-gray-500 font-normal">(-15%)</span></p>
                    `;
                } else {
                    priceHTML = `<p class="text-xl font-bold text-petroleo">${formatterCOP.format(p.price)}</p>`;
                }

                grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition flex flex-col">
                        <div class="h-48 w-full bg-gray-200 flex-shrink-0">
                            <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover">
                        </div>
                        <div class="p-4 flex-grow flex flex-col justify-between">
                            <div>
                                <span class="text-xs font-bold text-petroleolight uppercase tracking-wider">${p.category}</span>
                                <h3 class="text-lg font-bold text-gray-800 leading-tight mt-1 mb-2 font-montserrat">${p.name}</h3>
                                <p class="text-sm text-gray-600 mb-4 line-clamp-2">${p.description || ''}</p>
                            </div>
                            <div class="mt-auto">
                                ${priceHTML}
                                <a href="${WHATSAPP_LINK}" target="_blank" class="mt-4 block w-full text-center bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-lg transition duration-200">
                                    <i class="fa-brands fa-whatsapp mr-1"></i> ¡Lo quiero!
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Lógica de Administrador con carga de imágenes (Base64)
        function addProduct(e) {
            e.preventDefault();
            
            const name = document.getElementById('pName').value;
            const description = document.getElementById('pDescription').value;
            const category = document.getElementById('pCategory').value;
            const grams = parseFloat(document.getElementById('pGrams').value);
            const hours = parseFloat(document.getElementById('pHours').value);
            const margin = parseFloat(document.getElementById('pMargin').value) / 100;
            const fileInput = document.getElementById('pImageFile');

            if (fileInput.files.length === 0) {
                alert("Por favor selecciona una imagen.");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            // Esta función se ejecuta cuando la imagen termina de leerse
            reader.onload = function(event) {
                const imageBase64 = event.target.result; // Imagen convertida a texto

                // Cálculos Exactos solicitados por Qué Molde
                const costMaterial = grams * COSTO_GRAMO;
                const costTime = hours * COSTO_HORA;
                const totalCost = costMaterial + costTime + COSTO_EDICION + DESGASTE_MAQUINA;
                const finalPrice = totalCost * (1 + margin);

                const newProduct = {
                    id: Date.now(),
                    name, 
                    description,
                    category, 
                    image: imageBase64, 
                    grams, 
                    hours, 
                    margin: margin * 100, 
                    cost: totalCost, 
                    price: finalPrice
                };

                products.push(newProduct);
                saveData();
                renderAdminTable();
                
                // Limpiar el formulario
                document.getElementById('addProductForm').reset();
                document.getElementById('pMargin').value = "50";
            };

            // Leer el archivo como Base64
            reader.readAsDataURL(file);
        }

        function deleteProduct(id) {
            if(confirm("¿Seguro que deseas eliminar este producto?")) {
                products = products.filter(p => p.id !== id);
                saveData();
                renderAdminTable();
            }
        }

        function renderAdminTable() {
            const tbody = document.getElementById('adminTableBody');
            tbody.innerHTML = '';

            products.forEach(p => {
                const wholesalePrice = p.price * 0.85;
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="px-4 py-3 whitespace-nowrap">
                            <div class="flex items-center">
                                <img class="h-10 w-10 rounded object-cover mr-3" src="${p.image}" alt="">
                                <div class="text-sm font-medium text-gray-900">${p.name}</div>
                            </div>
                        </td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500">${p.category}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-900 text-right font-medium">${formatterCOP.format(p.cost)}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm text-petroleo text-right font-bold">${formatterCOP.format(p.price)}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-sm text-green-600 text-right font-bold">${formatterCOP.format(wholesalePrice)}</td>
                        <td class="px-4 py-3 whitespace-nowrap text-center text-sm font-medium">
                            <button onclick="deleteProduct(${p.id})" class="text-red-600 hover:text-red-900"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function saveData() {
            localStorage.setItem('quemolde_products', JSON.stringify(products));
            // Actualizar vista pública si cambian los datos
            if(currentMode !== 'admin') renderCatalog();
        }
    </script>
</body>
</html>
